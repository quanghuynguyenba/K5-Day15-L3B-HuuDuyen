# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Số không có trong bài Klook hoặc file Facebook thì ghi "(tự ước tính)".
# Không lấy 700 học viên của khoá. Chưa phỏng vấn, chưa khảo sát.
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50
seed: 42

users:
  low: 40
  base: 120
  high: 400
  source: "(tự ước tính) Chưa có số khách tự túc một ngày ở Hà Nội. Ba mức là quy mô giả định của nhóm người đang xếp một chuyến trong tháng, không phải thống kê thành phố và không phải sĩ số lớp."

personas:
  - name: dung_it
    share: 0.6
    uses_per_month: 1
    turns_per_session: 1
    source: "(tự ước tính) Canvas: ít = xếp một lần trước ngày đi. Chưa có số lần/tháng từ phỏng vấn."
  - name: dung_vua
    share: 0.3
    uses_per_month: 2
    turns_per_session: 2
    source: "(tự ước tính) Canvas: vừa = sửa vài lần. Tạm 2 phiên/tháng, 2 lượt mỗi phiên."
  - name: dung_nhieu
    share: 0.1
    uses_per_month: 4
    turns_per_session: 3
    source: "(tự ước tính) Canvas: nhiều = ngày mưa xếp lại nhiều vòng. Tạm 4 phiên/tháng, 3 lượt mỗi phiên."

prices:
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://developers.openai.com/api/docs/pricing · chép từ further-reading/model-prices.md (bảng Standard) · BTC xem 25/11/2026 · model thật của bản chạy thử, lượt 2 và simulate-2"
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · chép từ further-reading/model-prices.md · BTC xem 25/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · chép từ further-reading/model-prices.md · BTC xem 25/11/2026"

